<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="8">
    <title>Reconectando | Bola Cinco</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f7f4;
        color: #24342c;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 440px);
        padding: 40px 32px;
        border: 1px solid #e1e9e2;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 16px 48px rgb(35 55 42 / 8%);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e9f5ec;
        color: #32834c;
      }
      .icon svg { width: 30px; height: 30px; animation: spin 1.5s linear infinite; }
      h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 1.9rem); letter-spacing: -0.03em; }
      p { margin: 0; color: #64736a; line-height: 1.6; }
      .hint { margin-top: 20px; font-size: .9rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .icon svg { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.7 9a7 7 0 0 1 11.6-2L20 9M4 15l2.7 2a7 7 0 0 0 11.6-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Reconectando...</h1>
      <p>Estamos restabelecendo a conexão com o banco de dados. A página será atualizada automaticamente em alguns segundos.</p>
      <p class="hint">Se a conexão voltar antes, <a href="">atualize agora</a>.</p>
    </main>
  </body>
</html>
